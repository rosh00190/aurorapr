<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>Dynamic Game UI Test</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="game-container">
        <div class="main-panel">
            <div id="image-container">
                <img id="character-image" src="" alt="Character Image">
            </div>
            <div id="narration-box" class="text-box"></div>
            <div id="dialogue-box" class="text-box"></div>
        </div>
        <div class="side-panel">
            <h2>Parameters</h2>
            <div class="status-bar">
                <span>Stamina:</span>
                <span id="stamina-display"></span>
            </div>
            <div class="status-bar">
                <span>Feeling:</span>
                <span id="feeling-display"></span>
            </div>
            <hr>
            <h2>Commands</h2>
            <ul id="command-list"></ul>
        </div>
    </div>
    <script src="game.js"></script>
</body>
</html>
