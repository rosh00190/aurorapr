      - name: "페르소나 아르카나"
        file: 페르소나_아르카나
        #감성은 마음에 드는데 현재 너무 고정적이구만
      - name: "char의 스탯창"
        file: 캐릭터스탯창
#      - name: "운명 궁합"
#        file: test_운명궁합_2md
      - name: "궁합 테스트"
        file: 궁합테스트
      - name: "권태기사막에서 살아남기"
