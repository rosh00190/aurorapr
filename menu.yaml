# 각 메뉴 카테고리를 정의합니다.
categories:
  # '플랫폼/서비스 시뮬레이션' 카테고리
  - id: PlatformSim
    name: "🖥️ 플랫폼/서비스"
    prompt: "'플랫폼/서비스 시뮬레이션'의 세부 컨텐츠를 선택해주세요."
    items:
      - name: "우리FLIX"
        file: 우리FLIX
      - name: "오로라 클라우드"
        file: 오로라클라우드
      - name: "char 판매 페이지"
        file: 렌탈상품

  # '현실 컨텐츠 패러디' 카테고리
  - id: ContentParody
    name: "🌌 현실 밀착(세계관 몰입)형"
    prompt: "'현실 컨텐츠 패러디'의 세부 컨텐츠를 선택해주세요."
    items:
      - name: "아파트 게시판"
        file: 실시간_아파트게시판
      - name: "계절 카페 【네게】"
        file: 계절카페
      - name: "빗소리 머금은 창가: 오늘의 감정 스케치"
        file: 비창가스케치
      - name: "긴급 기자회견"
        file: 긴급기자회견

  # '캐릭터 탐구' 카테고리
  - id: CharacterAnalysis
    name: "🔎 캐릭터 탐구"
    prompt: "'캐릭터 탐구'의 세부 컨텐츠를 선택해주세요."
    items:
      - name: "마음 탐구 보고서"
        file: 마음탐구보고서
      - name: "비밀 장바구니 훔쳐보기"
        file: 장바구니훔쳐보기
      - name: "char 검색 기록"
        file: 검색기록
        #가끔 터미널이 안뜨네
      - name: "마음 해킹 ACCESS DENIED: HEART_DRIVE"
        file: 마음해킹
      - name: "성격 스탯 재분배 시뮬레이터"
        file: 성격스탯재분배

  # '관계 진단' 카테고리
  - id: RelationshipDiagnosis
    name: "📊 관계 진단"
    prompt: "'관계 진단'의 세부 컨텐츠를 선택해주세요."
    items:
      - name: "관계 영역 모의고사"
        file: 수능모의고사
      - name: "우리의 하루 리포트: 타임라인 보드"
        file: 우리하루리포트
      - name: "관계 가이드라인 설정하기"
        file: 관계가이드라인설정
      - name: "연애 재난 생존수칙"
        file: 연애재난수칙
      - name: "관계 표준 계약서"
        file: 관계표준계약서

  # '상황극' 카테고리
  - id: SituationalRoleplay
    name: "🎭 상황극"
    prompt: "'상황극'의 세부 컨텐츠를 선택해주세요."
    items:
    #char 반응 바로바로 띄우게
      - name: "CYOA"
        file: CYOA
      - name: "관계 특성 조합"
        file: 관계특성조합

  # '장르 IP 패러디' 카테고리
  - id: IpParody
    name: "🤹 장르 IP 패러디"
    prompt: "'장르 IP 패러디'의 세부 컨텐츠를 선택해주세요."
    items:
      - name: "포켓몬스터 배틀"
        file: 포켓몬_배틀
      - name: "어몽어스"
        file: 테스트어몽어스
      - name: "동물의 숲 프로필"
        file: 동물의숲_여권

  # '게임' 카테고리
  - id: Games
    name: "🎮 게임"
    prompt: "'게임'의 세부 컨텐츠를 선택해주세요."
    items:
      - name: "가위바위보"
        file: 가위바위보
      - name: "틱택토"
        file: 틱택토
      - name: "스마트폰 비번 해제"
        file: 비번해제
      - name: "추억 카드 맞추기"
        file: 추억카드맞추기

  # '창작' 카테고리
  - id: Creation
    name: "🎨 기타-종합"
    prompt: "'창작'의 세부 컨텐츠를 선택해주세요."
    items:
      - name: "감정연성술"
        file: 감정연성술
      - name: "즉흥 동화 만들기"
        file: 즉흥동화

  # '테스트' 카테고리
  - id: SystemMeta
    name: "🧪 테스트 중 QR 모음"
    prompt: "'테스트용 QR들' 모음입니다. 기능 테스트 및 정식 편입 전의 항목들을 테스트합니다."
    items:
        #각각 더 자세한 스타일가이드. 랜덤 활용으로 블럭단위 가능
      - name: "페르소나 아르카나"
        file: 페르소나_아르카나
        #감성은 마음에 드는데 현재 너무 고정적이구만
      - name: "char의 스탯창"
        file: 캐릭터스탯창
      - name: "테스트-운명 궁합(이미지아바타, 동적상호작용)"
        file: test_운명궁합_2md
      - name: "궁합 테스트"
        file: 궁합테스트
      - name: "권태기사막에서 살아남기"
        file: 권태기사막

# id 'random', 'settings', 'custom'은 JavaScript 코드에서 순서와 로직을 결정하기 위해 사용됩니다.
static_menus:
  - id: random
    name: "🎲 랜덤박스 미니극장"
    file: "_랜덤박스"
  - id: settings
    name: "⚙️ 캐릭터 설정"
  - id: custom
    name: "✍️ 커스텀 상황 입력"
