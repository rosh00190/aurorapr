      - name: "아파트 게시판"
        file: 실시간_아파트게시판
      - name: "인생네컷 포토부스"
        file: 인생네컷

  # '캐릭터 탐구' 카테고리
  - id: CharacterAnalysis
    name: "🔎 캐릭터 탐구"
    prompt: "'캐릭터 탐구'의 세부 컨텐츠를 선택해주세요."
