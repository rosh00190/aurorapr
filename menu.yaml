# static_menus: (아래와 같이 변경)
# id 'random', 'settings', 'custom'은 JavaScript 코드에서 순서와 로직을 결정하기 위해 사용됩니다.
static_menus:
  - id: random
    name: "🎲 랜덤박스 미니극장"
    file: "랜덤박스"  # 랜덤박스는 다른 동적 메뉴와 동일한 메커니즘을 사용하므로 file 속성을 유지합니다.
