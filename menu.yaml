      - name: "도플갱어 판독 게임"
        file: 도플갱어
        #스크롤이...
      - name: "char 뇌내 회의장 엿보기"
        file: 뇌내회의록
        #스포방지랑 이미지크기 조절...
      - name: "【시뮬봇】 이상형 월드컵"
        file: 시뮬봇_이상형월드컵
      - name: "고민 격파 게임"
        file: 걱정두더지잡기
      - name: "신문 보기"
        file: 신문
      - name: "여론조사"
        file: 여론조사
      - name: "언어학습"
        file: 언어학습
      - name: "달성한 관계 업적 보기"
        file: 업적시스템
      - name: "char 유언장"
        file: 유언장
      - name: "char 성분 분석"
        file: 성분분석표
      - name: "char 패치노트"
        file: 패치노트

# id 'random', 'settings', 'custom'은 JavaScript 코드에서 순서와 로직을 결정하기 위해 사용됩니다.
static_menus:
  - id: random
    name: "🎲 랜덤박스 미니극장"
    file: "_랜덤박스"
  - id: settings
    name: "⚙️ 캐릭터 설정"
  - id: custom
    name: "✍️ 커스텀 상황 입력"
